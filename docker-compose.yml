services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: covernor
      POSTGRES_PASSWORD: covernor
      POSTGRES_DB: covernor
    ports:
      - "15432:5432"
    volumes:
      - covernor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covernor -d covernor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  covernor_pg_data:
