name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: covernor
          POSTGRES_PASSWORD: covernor
          POSTGRES_DB: covernor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covernor -d covernor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://covernor:covernor@localhost:5432/covernor?schema=public
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret
          DATABASE_URL: postgresql://covernor:covernor@localhost:5432/covernor?schema=public
